<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AFR.OS // BUS_45_GATEWAY_FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root { --green: #00ff41; --amber: #ffcc66; }
        body { background: #000; color: var(--green); font-family: 'VT323', monospace; margin: 0; overflow: hidden; }
        .container { display: flex; height: 100vh; padding: 15px; box-sizing: border-box; gap: 15px; }
        
        /* VIDEO AREA */
        .scanner-box { 
            flex: 1.4; border: 1px solid var(--green); position: relative; 
            background: #050505; display: flex; align-items: center; justify-content: center;
        }
        #video { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
        canvas { position: absolute; transform: scaleX(-1); pointer-events: none; }

        /* BRIEF LOADING OVERLAY */
        #scan-overlay {
            position: absolute; inset: 0; background: rgba(0, 255, 65, 0.1);
            display: none; align-items: center; justify-content: center;
            font-size: 30px; z-index: 5; border: 2px solid var(--green);
        }

        /* SIDEBAR */
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .panel { border: 1px solid var(--green); padding: 12px; background: rgba(0, 255, 65, 0.02); }
        .log-container { height: 140px; overflow-y: auto; font-size: 13px; border-top: 1px solid #222; margin-top: 5px; }
        #status-bar { position: absolute; bottom: 0; left: 0; padding: 8px; background: rgba(0,0,0,0.9); color: var(--amber); width: 100%; z-index: 10; }
        #boot-overlay { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        button { background: transparent; border: 2px solid var(--green); color: var(--green); padding: 20px; font-family: 'VT323'; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div id="boot-overlay">
    <button onclick="bootSequence()">[ INITIALIZE_BUS_45_GATEWAY ]</button>
</div>

<div class="container">
    <div class="scanner-box" id="cam-container">
        <div id="scan-overlay">ANALYZING_BIOMETRICS...</div>
        <video id="video" autoplay muted playsinline></video>
        <div id="status-bar">STATUS: STANDBY...</div>
    </div>

    <div class="sidebar">
        <div class="panel">
            <h3 style="margin:0; color: var(--amber);">[ ATTENDANCE_LOG // BUS_45 ]</h3>
            <div id="attendance-log" class="log-container">> AWAITING MATCH...</div>
        </div>

        <div class="panel">
            <h3 style="margin:0; color: var(--green);">[ REALTIME_EMOTION_SCAN ]</h3>
            <div id="emotion-log" class="log-container">> STANDBY...</div>
        </div>

        <div class="panel" style="height: 220px;">
            <canvas id="emotionChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>
    const authorized = ['anshuman', 'adhish'];
    let attendanceSet = new Set();
    // Tracking indices for Chart.js: Neutral, Happy, Sad, Angry, Fearful, Surprised
    let emotionData = [0, 0, 0, 0, 0, 0];
    let chart, faceMatcher;

    async function bootSequence() {
        document.getElementById('boot-overlay').style.display = 'none';
        initChart(); // Start the chart immediately
        await startCamera();

        const status = document.getElementById('status-bar');
        try {
            status.innerText = "LOADING AI MODELS...";
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
            ]);

            status.innerText = "ENCODING BIOMETRIC ASSETS...";
            faceMatcher = await createMatcher();
            status.innerText = "SYSTEM_ACTIVE // SCANNING_BUS_45";
            runDetectionLoop();
        } catch (e) {
            status.innerText = "AI_ERROR: CHECK CONSOLE";
            runDetectionLoop(); // Still try to run camera
        }
    }

    async function startCamera() {
        const video = document.getElementById('video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        return new Promise(res => video.onloadedmetadata = res);
    }

    async function createMatcher() {
        const descriptors = [];
        for (const label of authorized) {
            try {
                const img = await faceapi.fetchImage(`./${label}.png`);
                const det = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                if (det) descriptors.push(new faceapi.LabeledFaceDescriptors(label, [det.descriptor]));
            } catch (e) { console.warn(`Skipping ${label}`); }
        }
        return descriptors.length > 0 ? new faceapi.FaceMatcher(descriptors, 0.6) : null;
    }

    function runDetectionLoop() {
        const video = document.getElementById('video');
        const canvas = faceapi.createCanvasFromMedia(video);
        const overlay = document.getElementById('scan-overlay');
        document.getElementById('cam-container').append(canvas);
        const displaySize = { width: video.clientWidth, height: video.clientHeight };
        faceapi.matchDimensions(canvas, displaySize);

        setInterval(async () => {
            // 1. BRIEF LOADING EFFECT
            overlay.style.display = 'flex';
            
            const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceExpressions().withFaceDescriptors();
            const resized = faceapi.resizeResults(detections, displaySize);
            
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            faceapi.draw.drawDetections(canvas, resized);

            resized.forEach(d => {
                const emotion = Object.entries(d.expressions).reduce((a, b) => a[1] > b[1] ? a : b)[0];
                let name = "UNKNOWN_GUEST";
                if (faceMatcher) name = faceMatcher.findBestMatch(d.descriptor).label;
                
                updateLogsAndChart(name, emotion);
            });

            // Hide loading after a short burst (500ms)
            setTimeout(() => { overlay.style.display = 'none'; }, 500);

        }, 2000); // 2 SECOND TIMER
    }

    function updateLogsAndChart(name, emotion) {
        const time = new Date().toLocaleTimeString();
        const emoLog = document.getElementById('emotion-log');
        emoLog.innerHTML = `<div>> [${time}] ${name.toUpperCase()}: ${emotion.toUpperCase()}</div>` + emoLog.innerHTML;

        if (name !== 'unknown' && name !== 'UNKNOWN_GUEST' && !attendanceSet.has(name)) {
            attendanceSet.add(name);
            document.getElementById('attendance-log').innerHTML = `<div style="color:var(--amber)">> [${time}] ${name.toUpperCase()}: LOGGED_BUS_45</div>` + document.getElementById('attendance-log').innerHTML;
        }

        // UPDATE CHART DATA
        const labels = ['neutral', 'happy', 'sad', 'angry', 'fearful', 'surprised'];
        const index = labels.indexOf(emotion);
        if (index !== -1) {
            emotionData[index]++;
            chart.update();
        }
    }

    function initChart() {
        const ctx = document.getElementById('emotionChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: ['Neutral', 'Happy', 'Sad', 'Angry', 'Fearful', 'Surprised'],
                datasets: [{ 
                    label: 'PSYCH_ANALYSIS', 
                    data: emotionData, 
                    backgroundColor: '#00ff41',
                    borderColor: '#00ff41',
                    borderWidth: 1
                }] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: { 
                    y: { beginAtZero: true, ticks: { color: '#00ff41', stepSize: 1 }, grid: { color: '#222' } },
                    x: { ticks: { color: '#00ff41' }, grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
</script>
</body>
</html>
