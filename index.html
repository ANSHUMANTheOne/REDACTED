<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AFR.OS // BUS_45_STABLE_FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        :root { --green: #00ff41; --amber: #ffcc66; }
        body { background: #000; color: var(--green); font-family: 'VT323', monospace; margin: 0; overflow: hidden; }
        .container { display: flex; height: 100vh; padding: 15px; box-sizing: border-box; gap: 15px; }
        
        /* VIDEO BOX */
        .scanner-box { flex: 1.4; border: 1px solid var(--green); position: relative; background: #050505; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
        #face-canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
        
        #scan-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.8); display: none; padding: 20px; font-size: 24px; z-index: 999; color: var(--green); border: 1px solid var(--green); }

        /* SIDEBAR BOXES */
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .panel { border: 1px solid var(--green); padding: 12px; background: rgba(0, 255, 65, 0.02); }
        .log-container { height: 140px; overflow-y: auto; font-size: 13px; border-top: 1px solid #222; margin-top: 5px; }
        
        /* CHART CONTAINER - LOCKS IT IN PLACE */
        .chart-panel { height: 250px; position: relative; } 
        
        #status-bar { position: absolute; bottom: 0; left: 0; padding: 8px; background: rgba(0,0,0,0.9); color: var(--amber); width: 100%; z-index: 10; }
        #boot-overlay { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        button { background: transparent; border: 2px solid var(--green); color: var(--green); padding: 20px; font-family: 'VT323'; cursor: pointer; font-size: 20px; }
        .dl-btn { border: 1px solid var(--amber); color: var(--amber); padding: 5px; font-size: 14px; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<div id="boot-overlay">
    <button onclick="bootSequence()">[ INITIALIZE_BUS_45_SYSTEM ]</button>
</div>

<div class="container">
    <div class="scanner-box">
        <div id="scan-overlay">ANALYZING_BIOMETRICS...</div>
        <video id="video" autoplay muted playsinline></video>
        <canvas id="face-canvas"></canvas> <div id="status-bar">STATUS: STANDBY...</div>
    </div>

    <div class="sidebar">
        <div class="panel">
            <h3 style="margin:0; color: var(--amber);">[ ATTENDANCE_LOG ]</h3>
            <div id="attendance-log" class="log-container">> WAITING...</div>
            <button class="dl-btn" onclick="downloadLogs()">[ SAVE_LOG_FILE ]</button>
        </div>
        <div class="panel">
            <h3 style="margin:0; color: var(--green);">[ REALTIME_EMOTION_SCAN ]</h3>
            <div id="emotion-log" class="log-container">> STANDBY...</div>
        </div>
        <div class="panel chart-panel">
            <h3 style="margin:0; color: var(--green);">[ PSYCH_METRIC_GRAPH ]</h3>
            <canvas id="sidebarChart"></canvas> </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>
    const TM_MODEL_URL = "https://teachablemachine.withgoogle.com/models/hHnONp-P9/"; 
    let attendanceSet = new Set();
    let attendanceHistory = [];
    let emotionData = [0, 0, 0, 0, 0, 0];
    let chart, tmModel;

    async function bootSequence() {
        document.getElementById('boot-overlay').style.display = 'none';
        initChart();
        await startCamera();
        try {
            const FACE_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(FACE_MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(FACE_MODEL_URL),
                tmImage.load(TM_MODEL_URL + "model.json", TM_MODEL_URL + "metadata.json").then(m => tmModel = m)
            ]);
            document.getElementById('status-bar').innerText = "SYSTEM_ACTIVE // BUS_45";
            runDetectionLoop();
        } catch (e) { console.error(e); }
    }

    async function startCamera() {
        const video = document.getElementById('video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        return new Promise(res => video.onloadedmetadata = res);
    }

    function runDetectionLoop() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('face-canvas');
        const displaySize = { width: video.clientWidth, height: video.clientHeight };
        faceapi.matchDimensions(canvas, displaySize);

        setInterval(async () => {
            document.getElementById('scan-overlay').style.display = 'block';
            const [detections, predictions] = await Promise.all([
                faceapi.detectAllFaces(video).withFaceLandmarks().withFaceExpressions(),
                tmModel.predict(video)
            ]);

            const top = predictions.reduce((a, b) => (a.probability > b.probability) ? a : b);
            const name = (top.probability > 0.85) ? top.className : "UNKNOWN";

            const resized = faceapi.resizeResults(detections, displaySize);
            const flipped = resized.map(d => {
                const box = d.detection.box;
                d.detection._box = new faceapi.Box(displaySize.width - box.x - box.width, box.y, box.width, box.height);
                return d;
            });

            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            faceapi.draw.drawDetections(canvas, flipped);
            faceapi.draw.drawFaceExpressions(canvas, flipped);

            flipped.forEach(d => {
                const emotion = Object.entries(d.expressions).reduce((a, b) => a[1] > b[1] ? a : b)[0];
                updateUI(name, emotion);
            });
            setTimeout(() => { document.getElementById('scan-overlay').style.display = 'none'; }, 600);
        }, 2000); 
    }

    function updateUI(name, emotion) {
        const time = new Date().toLocaleTimeString();
        document.getElementById('emotion-log').innerHTML = `<div>> [${time}] ${name}: ${emotion.toUpperCase()}</div>` + document.getElementById('emotion-log').innerHTML;

        if (name !== 'UNKNOWN' && name !== 'Background' && !attendanceSet.has(name)) {
            attendanceSet.add(name);
            attendanceHistory.push(`${new Date().toLocaleDateString()} ${time} - ${name}`);
            document.getElementById('attendance-log').innerHTML = `<div style="color:var(--amber)">> [${time}] ${name}: LOGGED</div>` + document.getElementById('attendance-log').innerHTML;
        }

        const labels = ['neutral', 'happy', 'sad', 'angry', 'fearful', 'surprised'];
        const idx = labels.indexOf(emotion);
        if (idx !== -1) { emotionData[idx]++; chart.update(); }
    }

    function downloadLogs() {
        const blob = new Blob([attendanceHistory.join('\n')], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "Bus_45_Attendance.txt";
        a.click();
    }

    function initChart() {
        const ctx = document.getElementById('sidebarChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: ['Neutral', 'Happy', 'Sad', 'Angry', 'Fearful', 'Surprised'], 
                datasets: [{ data: emotionData, backgroundColor: '#00ff41' }] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: { 
                    y: { beginAtZero: true, ticks: { color: '#00ff41', stepSize: 1 } },
                    x: { ticks: { color: '#00ff41' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
</script>
</body>
</html>
