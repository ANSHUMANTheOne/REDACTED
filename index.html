<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFR.OS // CORE_SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #ff4500;
            --red: #ff0000;
            --green: #00ff41;
            --amber: #ffcc66;
        }

        body, html {
            height: 100%; margin: 0; padding: 0;
            background: #000;
            font-family: 'VT323', monospace; color: var(--orange); overflow: hidden;
            user-select: none;
        }

        /* LOGIN SCREEN */
        #login-screen {
            position: fixed; inset: 0; background: black; z-index: 5000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        input {
            background: transparent; border: 1px solid var(--orange); color: var(--orange);
            font-family: 'VT323', monospace; font-size: 28px; padding: 12px; text-align: center;
            outline: none; box-shadow: 0 0 20px rgba(255, 69, 0, 0.3); margin-top: 20px;
        }

        /* ADMIN DESKTOP */
        .desktop { position: relative; width: 100%; height: 100%; display: none; background: radial-gradient(circle, #1a0800 0%, #000 100%); }

        /* GUEST BIOMETRIC GATEWAY (BUS 45) */
        #guest-space {
            position: fixed; inset: 0; background: #030303; display: none; 
            padding: 25px; color: var(--green); overflow-y: auto; z-index: 2000;
        }

        .guest-grid { display: flex; gap: 20px; margin-top: 20px; height: 75vh; }
        .scanner-box { flex: 1.5; border: 1px solid var(--green); background: #000; padding: 15px; position: relative; }
        .stats-box { flex: 1; border: 1px solid var(--green); padding: 15px; background: rgba(0, 255, 65, 0.03); }

        #video { width: 100%; height: auto; border: 1px solid #111; transform: scaleX(-1); background: #111; }
        
        /* UI WINDOWS */
        .win {
            position: absolute; background: rgba(0,0,0,0.9); border: 1px solid var(--orange);
            box-shadow: 0 0 25px rgba(255,69,0,0.15); overflow: hidden; z-index: 10;
        }
        .win-header { background: rgba(255,69,0,0.2); padding: 6px 15px; font-size: 16px; border-bottom: 1px solid var(--orange); color: white; }
        .win-body { padding: 15px; }

        #map-area { width: 100%; height: 250px; background: #050505; position: relative; border: 1px solid #220a00; }
        .pulse-dot { position: absolute; width: 12px; height: 12px; background: var(--red); border-radius: 50%; animation: ping 1.5s infinite; }
        @keyframes ping { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3.5); opacity: 0; } }

        .footer {
            position: fixed; bottom: 0; width: 100%; padding: 8px 25px;
            background: rgba(0,0,0,0.98); border-top: 1px solid var(--orange);
            font-size: 14px; display: flex; justify-content: space-between; z-index: 1001;
        }

        .sys-btn { background: var(--green); border: none; color: black; padding: 5px 15px; font-family: 'VT323'; cursor: pointer; font-weight: bold; margin-left: 10px; }
        .retry-btn { background: var(--red); color: white; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="font-size: 60px; letter-spacing: 20px; color: var(--red); margin: 0;">[ AFR.OS ]</h1>
    <input type="password" id="passInput" placeholder="ENTER_SYSTEM_KEY" autofocus>
</div>

<div class="desktop" id="main-desktop">
    <div class="win" style="top: 20px; left: 20px; width: 350px;">
        <div class="win-header">ADMIN_PROFILE</div>
        <div class="win-body" style="color: var(--amber);">USER: ANSHUMAN<br>STATUS: SUPREME_ADMIN</div>
    </div>
    <div class="win" style="bottom: 70px; left: 20px; width: 500px;">
        <div class="win-header">SATELLITE_GEOLOCATION</div>
        <div class="win-body"><div id="map-area"><div class="pulse-dot" id="target-dot"></div></div></div>
    </div>
    <div class="win" style="top: 20px; right: 20px; width: 320px;">
        <div class="win-header">PERSONNEL_WHITELIST</div>
        <div id="personnel-list" class="win-body" style="height: 400px; overflow-y: auto; color: var(--green); font-size: 14px;"></div>
    </div>
</div>

<div id="guest-space">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--green); padding-bottom: 10px;">
        <h1 style="margin:0;">[ BUS_45 // BIOMETRIC_GATEWAY ]</h1>
        <div>
            <button class="sys-btn" onclick="exportToExcel()">EXPORT_LOG</button>
        </div>
    </div>

    <div class="guest-grid">
        <div class="scanner-box">
            <video id="video" autoplay muted playsinline></video>
            <div id="scan-status" style="font-size: 28px; margin-top: 20px; color: var(--amber);">INITIALIZING...</div>
            <button id="retry-cam-btn" class="sys-btn retry-btn" onclick="requestCamera()">RETRY_CAMERA_ACCESS</button>
            <div id="progress-container" style="width: 100%; height: 12px; background: #111; margin-top: 15px; display:none;">
                <div id="progress-bar" style="width: 0%; height: 100%; background: var(--green);"></div>
            </div>
        </div>

        <div class="stats-box">
            <h3>BOARDING_LOG</h3>
            <div id="attendance-list" style="height: 250px; overflow-y: auto; border-bottom: 1px solid var(--green); font-size: 15px; margin-bottom: 25px;"></div>
            <h3>EMOTION_ANALYTICS</h3>
            <div style="height: 220px;"><canvas id="emotionChart"></canvas></div>
        </div>
    </div>
</div>

<div class="footer">
    <span>SYSTEM: AFR.OS // <span id="auth-tag">ENCRYPTED</span></span>
    <span id="sys-time">TIME: 00:00:00</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>
    const KEY_ADMIN = "A$N#H";
    const KEY_GUEST = "guest";
    const AUTH_USERS = ['anshuman', 'adhish'];
    const CLASS_LIST = ["MOKSH PRASHANTKUMAR SUTHAR", "MOOSA KHAN", "NAVANEETH PAYYADAKKATH", "PAYAS KULHARI", "RAYAN NIBU", "SAI TEJ SIDDHARTH AKULA", "SANJIT SURESH KUMAR", "ABHIRAM E. PANAYANTHATTA", "ADHISH JACOB ANIL", "ADIL ASLAM ALI CHILWAN", "ADITYA KARAN HARCHAND", "AROMAL AYYAPPAN SAMBAJI", "ARYAN MANDE", "HARIHARA GOMATHINATHAN", "ISHAN S. R. K. BEHERA", "ISIT S. R. K. BEHERA", "JONATHAN RAJ", "MOHAMMED IYAD ISMAIL KHAN", "MOHAMMED RAYHAN", "MOHAMMED RAYYAN KHAN", "ZAEEM"];

    let logs = [];
    let emoData = { Happy: 0, Neutral: 0, Sad: 0, Angry: 0, Surprised: 0 };
    let chartObj, faceMatcher;

    // LOGIN
    document.getElementById('passInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const val = this.value;
            if (val === KEY_ADMIN) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-desktop').style.display = 'block';
                loadAdminTools();
            } else if (val === KEY_GUEST) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('guest-space').style.display = 'block';
                initGuestSystem();
            }
        }
    });

    // CAMERA REQUEST FUNCTION
    async function requestCamera() {
        const video = document.getElementById('video');
        const status = document.getElementById('scan-status');
        const retryBtn = document.getElementById('retry-cam-btn');
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            status.innerText = "CAMERA_ONLINE // LOADING_MODELS...";
            retryBtn.style.display = "none";
            return true;
        } catch (err) {
            status.innerText = "CAMERA_ACCESS_DENIED";
            retryBtn.style.display = "block";
            return false;
        }
    }

    async function initGuestSystem() {
        initChart();
        const status = document.getElementById('scan-status');
        
        // 1. Immediately Ask for Camera
        await requestCamera();

        // 2. Load AI
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
        await Promise.all([
            faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
            faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
        ]);

        status.innerText = "ENCODING_PNG_ASSETS...";
        const descriptors = await Promise.all(AUTH_USERS.map(async user => {
            try {
                const img = await faceapi.fetchImage(`./${user}.png`);
                const det = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                return new faceapi.LabeledFaceDescriptors(user, [det.descriptor]);
            } catch (err) { return null; }
        }));

        faceMatcher = new faceapi.FaceMatcher(descriptors.filter(d => d !== null), 0.6);
        status.innerText = "SCANNER_READY";
        
        // 3. Start Detection Loop
        setInterval(async () => {
            const video = document.getElementById('video');
            const det = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceExpressions().withFaceDescriptor();
            if (det && faceMatcher) {
                const match = faceMatcher.findBestMatch(det.descriptor);
                if (match.label !== 'unknown') {
                    const emo = Object.keys(det.expressions).reduce((a, b) => det.expressions[a] > det.expressions[b] ? a : b);
                    handleMatch(match.label, emo);
                }
            }
        }, 3000);
    }

    function handleMatch(name, emotion) {
        const bar = document.getElementById('progress-bar');
        const cont = document.getElementById('progress-container');
        cont.style.display = 'block';
        
        let p = 0;
        let timer = setInterval(() => {
            p += 20; bar.style.width = p + "%";
            if (p >= 100) {
                clearInterval(timer);
                cont.style.display = 'none';
                bar.style.width = "0%";
                logArrival(name, emotion);
            }
        }, 100);
    }

    function logArrival(id, emo) {
        const time = new Date().toLocaleTimeString();
        if (logs.length > 0 && logs[0].name === id && logs[0].time.substring(0,5) === time.substring(0,5)) return;

        logs.unshift({ name: id.toUpperCase(), emo: emo.toUpperCase(), time });
        document.getElementById('attendance-list').innerHTML = `<div>> [${time}] ${id.toUpperCase()} // BOARDED (${emo.toUpperCase()})</div>` + document.getElementById('attendance-list').innerHTML;
        
        let emoKey = emo.charAt(0).toUpperCase() + emo.slice(1);
        if (emoData[emoKey] !== undefined) emoData[emoKey]++;
        chartObj.update();
        document.getElementById('scan-status').innerText = `WELCOME, ${id.toUpperCase()}`;
    }

    function initChart() {
        const ctx = document.getElementById('emotionChart').getContext('2d');
        chartObj = new Chart(ctx, {
            type: 'pie',
            data: { labels: Object.keys(emoData), datasets: [{ data: Object.values(emoData), backgroundColor: ['#00ff41', '#ffcc66', '#ff4500', '#ff0000', '#007bff'] }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function exportToExcel() {
        let csv = "NAME,EMOTION,TIME\n" + logs.map(l => `${l.name},${l.emo},${l.time}`).join("\n");
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Bus45_Log.csv';
        a.click();
    }

    function loadAdminTools() {
        const list = document.getElementById('personnel-list');
        CLASS_LIST.forEach(n => { list.innerHTML += `> ${n}<br>`; });
        setInterval(() => {
            const dot = document.getElementById('target-dot');
            dot.style.left = Math.random() * 90 + "%";
            dot.style.top = Math.random() * 80 + "%";
        }, 3000);
    }

    setInterval(() => { document.getElementById('sys-time').innerText = "TIME: " + new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
