<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AFR.OS // BIOMETRIC_GATEWAY_DEBUG</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root { --green: #00ff41; --amber: #ffcc66; --red: #ff0000; }
        body { background: #000; color: var(--green); font-family: 'VT323', monospace; margin: 0; overflow: hidden; }
        .container { display: flex; height: 100vh; padding: 20px; box-sizing: border-box; gap: 20px; }
        
        .scanner-box { 
            flex: 1.5; border: 1px solid var(--green); position: relative; 
            background: #050505; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #111; }
        canvas { position: absolute; transform: scaleX(-1); pointer-events: none; z-index: 5; }
        
        /* DEBUG CONSOLE */
        #debug-log {
            position: absolute; top: 10px; left: 10px; width: 300px; height: 150px;
            background: rgba(0,0,0,0.8); border: 1px solid var(--amber);
            font-size: 12px; color: var(--amber); padding: 5px; overflow-y: auto; z-index: 10;
        }

        #boot-overlay {
            position: fixed; inset: 0; background: black; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        button {
            background: transparent; border: 2px solid var(--green); color: var(--green);
            padding: 20px 40px; font-family: 'VT323'; font-size: 24px; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="boot-overlay">
    <button onclick="startSystem()">[ CLICK_TO_INITIALIZE_HARDWARE ]</button>
</div>

<div class="container">
    <div class="scanner-box" id="cam-box">
        <div id="debug-log">SYSTEM_READY...<br></div>
        <video id="video" autoplay muted playsinline></video>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>
    const logEl = document.getElementById('debug-log');
    function debug(msg) { 
        logEl.innerHTML += `> ${msg}<br>`; 
        logEl.scrollTop = logEl.scrollHeight;
        console.log(msg);
    }

    async function startSystem() {
        document.getElementById('boot-overlay').style.display = "none";
        debug("INIT: Starting models...");

        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';

        try {
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
            ]);
            debug("MODELS: Loaded successfully.");

            debug("CAMERA: Requesting access...");
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 640 }, height: { ideal: 480 } } 
            });
            
            const video = document.getElementById('video');
            video.srcObject = stream;

            // Wait for video to actually start playing
            video.onloadedmetadata = () => {
                debug("VIDEO: Metadata loaded.");
                video.play();
            };

            video.onplay = () => {
                debug("VIDEO: Stream playing.");
                setupDetection(video);
            };

        } catch (err) {
            debug(`FATAL_ERROR: ${err.message}`);
            if (window.location.protocol === 'file:') {
                debug("CRITICAL: Browsers block AI models on local files. Use CodePen or a Local Server.");
            }
        }
    }

    function setupDetection(video) {
        const canvas = faceapi.createCanvasFromMedia(video);
        document.getElementById('cam-box').append(canvas);
        
        const displaySize = { width: video.clientWidth, height: video.clientHeight };
        faceapi.matchDimensions(canvas, displaySize);
        debug("CANVAS: Overlay ready.");

        setInterval(async () => {
            const detections = await faceapi.detectAllFaces(video)
                .withFaceLandmarks()
                .withFaceExpressions();
            
            const resized = faceapi.resizeResults(detections, displaySize);
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            
            if (detections.length > 0) {
                faceapi.draw.drawDetections(canvas, resized);
                faceapi.draw.drawFaceExpressions(canvas, resized);
            }
        }, 100);
    }
</script>
</body>
</html>
