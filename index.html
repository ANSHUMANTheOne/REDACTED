<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFR.OS // ADMINISTRATIVE_CONSOLE</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #ff4500;
            --red: #ff0000;
            --green: #00ff41;
            --amber: #ffcc66;
        }

        body, html {
            height: 100%; margin: 0; padding: 0;
            background: radial-gradient(circle at center, #2b0d00 0%, #0d0400 60%, #000 100%);
            font-family: 'VT323', monospace; color: var(--orange); overflow: hidden;
            user-select: none;
        }

        .overlay-scan {
            position: fixed; inset: 0; pointer-events: none; z-index: 1000;
            background: repeating-linear-gradient(to bottom, rgba(255,69,0,0.08) 0px, transparent 2px);
        }

        #login-screen {
            position: fixed; inset: 0; background: black; z-index: 5000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        input {
            background: transparent; border: 1px solid var(--orange); color: var(--orange);
            font-family: 'VT323', monospace; font-size: 24px; padding: 10px; text-align: center;
            outline: none; box-shadow: 0 0 15px var(--orange); margin-top: 20px;
        }

        .desktop { position: relative; width: 100%; height: 100%; display: none; }

        .win {
            position: absolute; background: rgba(0,0,0,0.96); border: 1px solid var(--orange);
            box-shadow: 0 0 30px rgba(255,69,0,0.25); overflow: hidden; z-index: 10;
        }
        .win-header {
            background: rgba(255,69,0,0.3); padding: 5px 12px; font-size: 14px;
            border-bottom: 1px solid var(--orange); cursor: move; display: flex; justify-content: space-between;
        }
        .win-body { padding: 12px; }

        #security-alert {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--red); color: white; padding: 30px; z-index: 10000;
            font-size: 32px; border: 4px solid white; text-align: center; font-weight: bold;
        }

        /* ★ AFR INTRO STYLES (ADDED) */
        #afr-intro {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 20000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #afr-title {
            font-size: 140px;
            letter-spacing: 18px;
            color: var(--orange);
            text-shadow: 0 0 30px var(--orange);
            animation: glitchPulse 1.4s infinite;
        }

        #afr-full {
            font-size: 28px;
            margin-top: 10px;
            color: var(--amber);
            opacity: 0;
            transition: opacity 0.6s;
        }

        #afr-boot {
            margin-top: 25px;
            font-size: 18px;
            color: var(--green);
            opacity: 0.7;
        }

        @keyframes glitchPulse {
            0% { text-shadow: 0 0 10px var(--orange); }
            25% { text-shadow: -3px 0 var(--red), 3px 0 #ff9900; }
            50% { text-shadow: 0 0 30px var(--orange); }
            75% { text-shadow: 3px 0 var(--red), -3px 0 #ff9900; }
            100% { text-shadow: 0 0 10px var(--orange); }
        }
    </style>
</head>

<body oncontextmenu="return triggerLockout();">

<!-- ★ AFR INTRO SCREEN (ADDED) -->
<div id="afr-intro">
    <div id="afr-title"></div>
    <div id="afr-full">Anshuman’s Frontier Research</div>
    <div id="afr-boot">INITIALIZING CORE SYSTEMS…</div>
</div>

<div id="security-alert">FORGING IS UNAUTHORIZED // ACCESS LOGGED</div>

<div id="login-screen">
    <h1 style="font-size: 50px; letter-spacing: 15px; color: var(--red);">[ AFR.OS // CORE ]</h1>
    <input type="password" id="passInput" placeholder="SYSTEM_KEY" autofocus>
</div>

<div class="overlay-scan"></div>

<!-- (REST OF YOUR FILE CONTINUES UNCHANGED) -->

<script>
/* ★ AFR INTRO SCRIPT (ADDED) */
const afrText = "AFR";
let afrIndex = 0;
const afrTitle = document.getElementById("afr-title");
const afrFull = document.getElementById("afr-full");

const afrType = setInterval(() => {
    afrTitle.textContent += afrText[afrIndex];
    afrIndex++;
    if (afrIndex === afrText.length) {
        clearInterval(afrType);
        setTimeout(() => afrFull.style.opacity = "1", 300);
    }
}, 400);

window.addEventListener("load", () => {
    setTimeout(() => {
        const intro = document.getElementById("afr-intro");
        intro.style.transition = "opacity 1s";
        intro.style.opacity = "0";
        setTimeout(() => intro.remove(), 1000);
    }, 3200);
});
</script>

</body>
</html>
