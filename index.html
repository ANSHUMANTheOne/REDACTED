<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFR.OS // ADMINISTRATIVE_CONSOLE</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #ff4500;
            --red: #ff0000;
            --green: #00ff41;
            --amber: #ffcc66;
        }

        body, html {
            height: 100%; margin: 0; padding: 0;
            background: radial-gradient(circle at center, #2b0d00 0%, #0d0400 60%, #000 100%);
            font-family: 'VT323', monospace; color: var(--orange); overflow: hidden;
            user-select: none;
        }

        .overlay-scan {
            position: fixed; inset: 0; pointer-events: none; z-index: 1000;
            background: repeating-linear-gradient(to bottom, rgba(255,69,0,0.08) 0px, transparent 2px);
        }

        #login-screen {
            position: fixed; inset: 0; background: black; z-index: 5000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        input {
            background: transparent; border: 1px solid var(--orange); color: var(--orange);
            font-family: 'VT323', monospace; font-size: 24px; padding: 10px; text-align: center;
            outline: none; box-shadow: 0 0 15px var(--orange); margin-top: 20px;
        }

        .desktop { position: relative; width: 100%; height: 100%; display: none; }

        .win {
            position: absolute; background: rgba(0,0,0,0.96); border: 1px solid var(--orange);
            box-shadow: 0 0 30px rgba(255,69,0,0.25); overflow: hidden; z-index: 10;
        }
        .win-header {
            background: rgba(255,69,0,0.3); padding: 5px 12px; font-size: 14px;
            border-bottom: 1px solid var(--orange); cursor: move; display: flex; justify-content: space-between;
        }
        .win-body { padding: 12px; }

        #security-alert {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--red); color: white; padding: 30px; z-index: 10000;
            font-size: 32px; border: 4px solid white; text-align: center; font-weight: bold;
        }

        .footer {
            position: fixed; bottom: 0; width: 100%; padding: 6px 20px;
            background: rgba(0,0,0,0.95); border-top: 1px solid var(--orange);
            font-size: 14px; display: flex; justify-content: space-between; z-index: 1001;
        }
    </style>
</head>
<body oncontextmenu="return triggerLockout();">

<div id="security-alert">FORGING IS UNAUTHORIZED // ACCESS LOGGED</div>

<div id="login-screen">
    <h1 style="font-size: 50px; letter-spacing: 15px; color: var(--red);">[ AFR.OS // CORE ]</h1>
    <input type="password" id="passInput" placeholder="SYSTEM_KEY" autofocus>
</div>

<div class="overlay-scan"></div>

<div class="desktop" id="main-desktop">
    <div class="win" id="w-admin" style="bottom: 70px; right: 20px; width: 320px;">
        <div class="win-header" style="background:rgba(255, 204, 102, 0.3);">ADMIN_MONITOR // AUTH_LEVEL_10</div>
        <div class="win-body" style="color: var(--amber);">
            NAME: <span style="background: var(--amber); color: black;">Anshuxxx xxxxxxxx</span><br>
            ROLE: <span style="color: var(--red);">SUPREME_ADMIN</span><br>
            AUTH: VERIFIED [AFR_FED_ORG]
        </div>
    </div>
</div>

<div class="footer">
    <span>SYSTEM: AFR.OS // AUTH: <span id="auth-tag">OFFLINE</span></span>
    <span id="sys-time">TIME: 00:00:00</span>
</div>

<script>
    const adminPass = "A$N#H";
    const guestPass = "guest";

    document.getElementById('passInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const val = this.value;
            if (val === adminPass) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-desktop').style.display = 'block';
                document.getElementById('auth-tag').innerText = "ADMIN_ANSHU";
                startAdminOS();
            } else if (val === guestPass) {
                startGuestBoot();
            } else {
                triggerLockout();
                this.value = "";
            }
        }
    });

    function startAdminOS() {
        console.log("Admin OS Mode: Active");
        // Draggable window logic can go here
    }

    function startGuestBoot() {
        const login = document.getElementById('login-screen');

        login.innerHTML = `
            <h1 style="font-size:50px; letter-spacing:15px; color:#00ff41;">
                [ AFR.OS // KERNEL_HANDOFF ]
            </h1>
            <div id="boot-log" style="
                margin-top:25px;
                font-size:24px;
                color:#00ff41;
                width:600px;
                text-align:left;
            "></div>
        `;

        const logs = [
            "AUTH_GUEST: VERIFIED",
            "ADMIN_KERNEL: ISOLATED",
            "UNMOUNTING_CORE_MODULES",
            "SPAWNING BUS_45_SANDBOX",
            "LOADING_AI_DRIVERS",
            "SYNCING_CAMERA_INTERFACE",
            "HANDOFF_COMPLETE"
        ];

        const logBox = document.getElementById("boot-log");
        let i = 0;

        const interval = setInterval(() => {
            logBox.innerHTML += `> ${logs[i]}<br>`;
            i++;
            if (i === logs.length) {
                clearInterval(interval);
                setTimeout(() => {
                    // OPENS IN NEW TAB
                    window.open("bus45.html", "_blank");
                    
                    // REFRESHES MAIN TAB BACK TO LOGIN
                    location.reload(); 
                }, 800);
            }
        }, 450);
    }

    function triggerLockout() {
        const alertBox = document.getElementById('security-alert');
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 2500);
        return false;
    }

    setInterval(() => { 
        document.getElementById('sys-time').innerText = "TIME: " + new Date().toLocaleTimeString(); 
    }, 1000);
</script>
</body>
</html>
