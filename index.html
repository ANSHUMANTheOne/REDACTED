<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AFR.OS // BUS_45_STABLE_V9</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        :root { --green: #00ff41; --amber: #ffcc66; }
        body { background: #000; color: var(--green); font-family: 'VT323', monospace; margin: 0; overflow: hidden; }
        .container { display: flex; height: 100vh; padding: 15px; box-sizing: border-box; gap: 15px; }
        .scanner-box { flex: 1.4; border: 1px solid var(--green); position: relative; background: #050505; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        #scan-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); display: none; padding: 25px; font-size: 28px; z-index: 999; color: var(--green); border: 2px solid var(--green); }
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .panel { border: 1px solid var(--green); padding: 12px; background: rgba(0, 255, 65, 0.02); }
        .log-container { height: 140px; overflow-y: auto; font-size: 13px; border-top: 1px solid #222; margin-top: 5px; }
        button { width: 100%; background: transparent; border: 1px solid var(--amber); color: var(--amber); padding: 10px; font-family: 'VT323'; cursor: pointer; margin-top: 10px; }
        #boot-overlay { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="boot-overlay">
    <button style="font-size:24px; border: 2px solid var(--green); color: var(--green);" onclick="bootSequence()">[ START_GATEWAY_V9 ]</button>
</div>

<div class="container">
    <div class="scanner-box" id="cam-container">
        <div id="scan-overlay">SYNCING_AI_CORES...</div>
        <video id="video" autoplay muted playsinline></video>
    </div>

    <div class="sidebar">
        <div class="panel">
            <h3 style="margin:0; color: var(--amber);">[ ATTENDANCE_LOG ]</h3>
            <div id="attendance-log" class="log-container">> STANDBY...</div>
            <button onclick="downloadLogs()">[ SAVE_LOG_FILE ]</button>
        </div>
        <div class="panel">
            <h3 style="margin:0; color: var(--green);">[ EMOTION_SCAN ]</h3>
            <div id="emotion-log" class="log-container">> READY...</div>
        </div>
        <div class="panel" style="height: 200px;"><canvas id="emotionChart"></canvas></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>
    const TM_URL = "https://teachablemachine.withgoogle.com/models/hHnONp-P9/"; 
    let attendanceHistory = [];
    let attendanceSet = new Set();
    let emotionData = [0, 0, 0, 0, 0, 0];
    let chart, tmModel;

    async function bootSequence() {
        document.getElementById('boot-overlay').style.display = 'none';
        initChart();
        
        // 1. Start Video
        const video = document.getElementById('video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        
        // 2. Load Models
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
        tmModel = await tmImage.load(TM_URL + "model.json", TM_URL + "metadata.json");

        runLoop();
    }

    async function runLoop() {
        const video = document.getElementById('video');
        const canvas = faceapi.createCanvasFromMedia(video);
        document.getElementById('cam-container').append(canvas);
        const displaySize = { width: video.clientWidth, height: video.clientHeight };
        faceapi.matchDimensions(canvas, displaySize);

        setInterval(async () => {
            document.getElementById('scan-overlay').style.display = 'block';

            // IDENTITY (Teachable)
            const predictions = await tmModel.predict(video);
            const top = predictions.reduce((a, b) => (a.probability > b.probability) ? a : b);
            const name = top.probability > 0.80 ? top.className : "UNKNOWN";

            // EMOTIONS (FaceAPI)
            const detections = await faceapi.detectAllFaces(video).withFaceExpressions();
            const resized = faceapi.resizeResults(detections, displaySize);

            // CLEAR & DRAW
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            resized.forEach(det => {
                const box = det.detection.box;
                // THE MIRROR MATH FIX
                const adjX = displaySize.width - box.x - box.width;
                
                ctx.strokeStyle = '#00ff41';
                ctx.lineWidth = 2;
                ctx.strokeRect(adjX, box.y, box.width, box.height);
                
                ctx.fillStyle = '#00ff41';
                ctx.font = '18px VT323';
                ctx.fillText(`${name.toUpperCase()} (${Math.round(top.probability*100)}%)`, adjX, box.y > 20 ? box.y - 5 : 20);

                const emotion = Object.entries(det.expressions).reduce((a, b) => a[1] > b[1] ? a : b)[0];
                updateAll(name, emotion);
            });

            setTimeout(() => { document.getElementById('scan-overlay').style.display = 'none'; }, 500);
        }, 2000);
    }

    function updateAll(name, emotion) {
        const time = new Date().toLocaleTimeString();
        if (name !== 'UNKNOWN' && name !== 'Background' && !attendanceSet.has(name)) {
            attendanceSet.add(name);
            attendanceHistory.push(`${new Date().toLocaleDateString()} ${time} - ${name}`);
            document.getElementById('attendance-log').innerHTML = `<div>> [${time}] ${name}: LOGGED</div>` + document.getElementById('attendance-log').innerHTML;
        }
        document.getElementById('emotion-log').innerHTML = `<div>> [${time}] ${emotion.toUpperCase()}</div>` + document.getElementById('emotion-log').innerHTML;
        
        const labels = ['neutral', 'happy', 'sad', 'angry', 'fearful', 'surprised'];
        const i = labels.indexOf(emotion);
        if (i !== -1) { emotionData[i]++; chart.update(); }
    }

    function downloadLogs() {
        const blob = new Blob([attendanceHistory.join('\n')], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "BUS_45_LOG.txt";
        a.click();
    }

    function initChart() {
        const ctx = document.getElementById('emotionChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Neut', 'Happ', 'Sad', 'Angr', 'Fear', 'Surp'], datasets: [{ data: emotionData, backgroundColor: '#00ff41' }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { color: '#00ff41', stepSize: 1 } }, x: { ticks: { color: '#00ff41' } } }, plugins: { legend: { display: false } } }
        });
    }
</script>
</body>
</html>
