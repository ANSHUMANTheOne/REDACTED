<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AFR.OS // BUS_45_HYBRID_GATEWAY</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        :root { --green: #00ff41; --amber: #ffcc66; }
        body { background: #000; color: var(--green); font-family: 'VT323', monospace; margin: 0; overflow: hidden; }
        .container { display: flex; height: 100vh; padding: 15px; box-sizing: border-box; gap: 15px; }
        .scanner-box { flex: 1.4; border: 1px solid var(--green); position: relative; background: #050505; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        #scan-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.8); display: none; padding: 20px; font-size: 24px; z-index: 999; color: var(--green); border: 1px solid var(--green); }
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .panel { border: 1px solid var(--green); padding: 12px; background: rgba(0, 255, 65, 0.02); }
        .log-container { height: 140px; overflow-y: auto; font-size: 13px; border-top: 1px solid #222; margin-top: 5px; }
        #status-bar { position: absolute; bottom: 0; left: 0; padding: 8px; background: rgba(0,0,0,0.9); color: var(--amber); width: 100%; z-index: 10; }
        #boot-overlay { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        button { background: transparent; border: 2px solid var(--green); color: var(--green); padding: 20px; font-family: 'VT323'; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div id="boot-overlay">
    <button onclick="bootSequence()">[ INITIALIZE_BUS_45_TEACHABLE_GATEWAY ]</button>
</div>

<div class="container">
    <div class="scanner-box" id="cam-container">
        <div id="scan-overlay">ANALYZING_BIOMETRICS...</div>
        <video id="video" autoplay muted playsinline></video>
        <div id="status-bar">STATUS: STANDBY...</div>
    </div>

    <div class="sidebar">
        <div class="panel">
            <h3 style="margin:0; color: var(--amber);">[ ATTENDANCE_LOG // BUS_45 ]</h3>
            <div id="attendance-log" class="log-container">> AWAITING MATCH...</div>
        </div>
        <div class="panel">
            <h3 style="margin:0; color: var(--green);">[ REALTIME_EMOTION_SCAN ]</h3>
            <div id="emotion-log" class="log-container">> STANDBY...</div>
        </div>
        <div class="panel" style="height: 220px;">
            <canvas id="emotionChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>
    // --- UPDATE YOUR TEACHABLE MACHINE URL HERE ---
    const TM_MODEL_URL = "YOUR_MODEL_URL_GOES_HERE"; 
    
    let attendanceSet = new Set();
    let emotionData = [0, 0, 0, 0, 0, 0];
    let chart, tmModel, faceMatcher;

    async function bootSequence() {
        document.getElementById('boot-overlay').style.display = 'none';
        initChart();
        await startCamera();

        const status = document.getElementById('status-bar');
        try {
            status.innerText = "LOADING HYBRID AI CORE...";
            const FACE_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
            
            // Load both Face-API (Emotions) and Teachable Machine (Identity)
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(FACE_MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(FACE_MODEL_URL),
                tmImage.load(TM_MODEL_URL + "model.json", TM_MODEL_URL + "metadata.json")
                    .then(model => tmModel = model)
            ]);

            status.innerText = "SYSTEM_ACTIVE // BUS_45_GATEWAY";
            runDetectionLoop();
        } catch (e) {
            status.innerText = "AI_INIT_FAILED: Check Model URL";
            console.error(e);
        }
    }

    async function startCamera() {
        const video = document.getElementById('video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        return new Promise(res => video.onloadedmetadata = res);
    }

    function runDetectionLoop() {
        const video = document.getElementById('video');
        const overlay = document.getElementById('scan-overlay');
        const camContainer = document.getElementById('cam-container');
        
        const canvas = faceapi.createCanvasFromMedia(video);
        camContainer.append(canvas);
        
        const displaySize = { width: video.clientWidth, height: video.clientHeight };
        faceapi.matchDimensions(canvas, displaySize);

        setInterval(async () => {
            overlay.style.display = 'block';
            
            // 1. Run Face-API for Emotion & Box
            const faceTask = faceapi.detectAllFaces(video).withFaceLandmarks().withFaceExpressions();
            
            // 2. Run Teachable Machine for Identity
            const tmTask = tmModel.predict(video);

            const [detections, predictions] = await Promise.all([faceTask, tmTask]);
            
            // Find the top prediction from Teachable Machine
            const topPrediction = predictions.reduce((prev, current) => (prev.probability > current.probability) ? prev : current);
            let name = (topPrediction.probability > 0.85) ? topPrediction.className : "UNKNOWN_GUEST";

            // Process Bounding Box Mirror Fix
            const resized = faceapi.resizeResults(detections, displaySize);
            const flippedDetections = resized.map(d => {
                const box = d.detection.box;
                const flippedBox = new faceapi.Box(displaySize.width - box.x - box.width, box.y, box.width, box.height);
                d.detection._box = flippedBox;
                return d;
            });

            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            faceapi.draw.drawDetections(canvas, flippedDetections);
            faceapi.draw.drawFaceExpressions(canvas, flippedDetections);

            flippedDetections.forEach(d => {
                const emotion = Object.entries(d.expressions).reduce((a, b) => a[1] > b[1] ? a : b)[0];
                updateLogsAndChart(name, emotion);
            });

            setTimeout(() => { overlay.style.display = 'none'; }, 600);
        }, 2000); 
    }

    function updateLogsAndChart(name, emotion) {
        const time = new Date().toLocaleTimeString();
        document.getElementById('emotion-log').innerHTML = `<div>> [${time}] ${name.toUpperCase()}: ${emotion.toUpperCase()}</div>` + document.getElementById('emotion-log').innerHTML;

        if (name !== 'UNKNOWN_GUEST' && name !== 'Background' && !attendanceSet.has(name)) {
            attendanceSet.add(name);
            document.getElementById('attendance-log').innerHTML = `<div style="color:var(--amber)">> [${time}] ${name.toUpperCase()}: LOGGED_BUS_45</div>` + document.getElementById('attendance-log').innerHTML;
        }

        const labels = ['neutral', 'happy', 'sad', 'angry', 'fearful', 'surprised'];
        const index = labels.indexOf(emotion);
        if (index !== -1) {
            emotionData[index]++;
            chart.update();
        }
    }

    function initChart() {
        const ctx = document.getElementById('emotionChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: ['Neutral', 'Happy', 'Sad', 'Angry', 'Fearful', 'Surprised'],
                datasets: [{ data: emotionData, backgroundColor: '#00ff41' }] 
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { color: '#00ff41', stepSize: 1 }, grid: { color: '#222' } }, x: { ticks: { color: '#00ff41' }, grid: { display: false } } }, plugins: { legend: { display: false } } }
        });
    }
</script>
</body>
</html>
