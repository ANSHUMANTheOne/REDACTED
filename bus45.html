<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AFR.OS // BUS_45_STABLE_V11</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        :root { --green: #00ff41; --amber: #ffcc66; --red: #ff4500; }
        body { background: #000; color: var(--green); font-family: 'VT323', monospace; margin: 0; overflow: hidden; }
        .container { display: flex; height: 100vh; padding: 15px; box-sizing: border-box; gap: 15px; }

        /* Left Side: Scanner */
        .scanner-box { flex: 1.4; border: 1px solid var(--green); position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #video-container { width: 100%; height: 100%; position: relative; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }

        /* Right Side: Logs & Stats */
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 350px; }
        .panel { border: 1px solid var(--green); padding: 12px; background: rgba(0, 255, 65, 0.02); position: relative; }
        .log-container { height: 130px; overflow-y: auto; font-size: 13px; border-top: 1px solid #222; margin-top: 5px; }
        
        /* Bar Graph Styling */
        .emotion-bar-wrapper { margin-bottom: 8px; }
        .bar-bg { width: 100%; height: 12px; background: #111; border: 1px solid #333; position: relative; }
        .bar-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.2s; }

        #status-bar { position: absolute; bottom: 0; left: 0; padding: 8px; background: rgba(0,0,0,0.9); color: var(--amber); width: 100%; z-index: 10; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="scanner-box">
        <div id="video-container"></div>
        <div id="status-bar">SYSTEM_ACTIVE // BUS_45 // AI_INIT_SUCCESS</div>
    </div>

    <div class="sidebar">
        <div class="panel">
            [ ATTENDANCE_LOG ]
            <div id="attendance-log" class="log-container">> WAITING_FOR_IDENT...</div>
        </div>

        <div class="panel">
            [ EMOTION_SCAN ]
            <div id="label-container" style="padding-top:10px;"></div>
            <div id="emotion-log" class="log-container">> MONITORING_STREAM#9...</div>
        </div>

        <div class="panel" style="flex: 1;">
            [ PSYCH_METRIC_GRAPH ]
            <div id="graph-area" style="margin-top:15px;"></div>
        </div>
        
        <button onclick="window.location.href='index.html'" style="background:transparent; border:1px solid var(--red); color:var(--red); font-family:'VT323'; padding:10px; cursor:pointer;">[ TERMINATE_SESSION ]</button>
    </div>
</div>

<script>
    // Replace this URL with your actual Teachable Machine model link
    const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_ID/"; 

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // Load model
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Setup Webcam
        const flip = true;
        webcam = new tmImage.Webcam(400, 400, flip);
        await webcam.setup(); 
        await webcam.play();
        window.requestAnimationFrame(loop);

        // Append webcam to UI
        document.getElementById("video-container").appendChild(webcam.canvas);
        
        // Setup Label Bars
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) {
            const wrapper = document.createElement("div");
            wrapper.className = "emotion-bar-wrapper";
            wrapper.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-size:12px;">
                    <span>${model.getClassLabels()[i]}</span><span id="val-${i}">0%</span>
                </div>
                <div class="bar-bg"><div id="bar-${i}" class="bar-fill"></div></div>
            `;
            labelContainer.appendChild(wrapper);
        }
        
        document.getElementById('attendance-log').innerHTML = "> [SUCCESS] Identity: ANSHUMAN_VERIFIED";
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const score = (prediction[i].probability * 100).toFixed(0);
            document.getElementById(`bar-${i}`).style.width = score + "%";
            document.getElementById(`val-${i}`).innerText = score + "%";
            
            // Log if emotion is high
            if(score > 80) {
                const log = document.getElementById('emotion-log');
                log.innerHTML = `> [${new Date().toLocaleTimeString()}] DETECTED: ${prediction[i].className}<br>` + log.innerHTML;
            }
        }
    }

    // AUTO-START TRIGGER
    // This is the "magic" that skips the login screen on bus45.html
    window.onload = () => {
        console.log("Kernel Handoff Received. Initializing AI...");
        init();
    };
</script>
</body>
</html>
