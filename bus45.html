<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AFR.OS // BUS_45_STABLE_V11</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        :root { --green: #00ff41; --amber: #ffcc66; --red: #ff4500; }
        body { background: #000; color: var(--green); font-family: 'VT323', monospace; margin: 0; overflow: hidden; }
        .container { display: flex; height: 100vh; padding: 15px; box-sizing: border-box; gap: 15px; }

        /* Left Side: Scanner Box */
        .scanner-box { flex: 1.4; border: 1px solid var(--green); position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #video-container { width: 100%; height: 100%; position: relative; }
        canvas { width: 100% !important; height: 100% !important; transform: scaleX(-1); object-fit: cover; }

        /* Right Side: Panels */
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 350px; }
        .panel { border: 1px solid var(--green); padding: 12px; background: rgba(0, 255, 65, 0.02); position: relative; }
        .log-container { height: 120px; overflow-y: auto; font-size: 13px; border-top: 1px solid #222; margin-top: 5px; color: var(--green); }
        
        /* Emotion Bars */
        .bar-bg { width: 100%; height: 10px; background: #111; border: 1px solid #333; margin-top: 4px; }
        .bar-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.1s; }

        #boot-overlay { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .init-btn { background: transparent; border: 2px solid var(--green); color: var(--green); padding: 20px; font-family: 'VT323'; font-size: 20px; cursor: pointer; box-shadow: 0 0 15px var(--green); }
        
        #status-bar { position: absolute; bottom: 0; left: 0; padding: 8px; background: rgba(0,0,0,0.8); color: var(--amber); width: 100%; z-index: 10; font-size: 14px; border-top: 1px solid var(--green); }
    </style>
</head>
<body>

<div id="boot-overlay">
    <button class="init-btn" onclick="startSequence()">[ INITIALIZE_STABLE_SYSTEM_V11 ]</button>
</div>

<div class="container">
    <div class="scanner-box">
        <div id="video-container"></div>
        <div id="status-bar">SYSTEM_ACTIVE // BUS_45 // AI_INIT_SUCCESS</div>
    </div>

    <div class="sidebar">
        <div class="panel">
            [ ATTENDANCE_LOG ]
            <div id="attendance-log" class="log-container">> WAITING_FOR_INIT...</div>
        </div>

        <div class="panel">
            [ REALTIME_EMOTION_SCAN ]
            <div id="label-container" style="padding-top:10px;"></div>
        </div>

        <div class="panel" style="flex: 1;">
            [ PSYCH_METRIC_LOG ]
            <div id="psych-log" class="log-container" style="height: 200px;"></div>
        </div>
        
        <button onclick="window.location.href='index.html'" style="background:transparent; border:1px solid var(--red); color:var(--red); font-family:'VT323'; padding:10px; cursor:pointer;">[ TERMINATE_SESSION ]</button>
    </div>
</div>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/hHnONp-P9/"; 
    let model, webcam, labelContainer, maxPredictions;

    async function startSequence() {
        document.getElementById('boot-overlay').style.display = 'none';
        const log = document.getElementById('attendance-log');
        log.innerHTML = "> BOOTING_AI_MODULES...";
        
        try {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(400, 400, true); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("video-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.innerHTML += `
                    <div style="margin-bottom:8px">
                        <div style="display:flex; justify-content:space-between; font-size:12px">
                            <span>${model.getClassLabels()[i]}</span><span id="val-${i}">0%</span>
                        </div>
                        <div class="bar-bg"><div id="bar-${i}" class="bar-fill"></div></div>
                    </div>`;
            }
            log.innerHTML = "> [SUCCESS] IDENTITY: ANSHUMAN_VERIFIED<br>> [SUCCESS] SENSOR_LINK: ACTIVE";
        } catch (e) {
            log.innerHTML = "<span style='color:red'>> [ERROR] CAMERA_ACCESS_DENIED</span>";
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        const psychLog = document.getElementById('psych-log');

        for (let i = 0; i < maxPredictions; i++) {
            const score = (prediction[i].probability * 100).toFixed(0);
            document.getElementById(`bar-${i}`).style.width = score + "%";
            document.getElementById(`val-${i}`).innerText = score + "%";

            // If an emotion is dominant (>85%), log it to the Psych Metric area
            if (score > 85) {
                const time = new Date().toLocaleTimeString();
                psychLog.innerHTML = `> [${time}] DETECTED: ${prediction[i].className} (${score}%)<br>` + psychLog.innerHTML;
                // Keep log from getting too long
                if(psychLog.innerHTML.split('<br>').length > 10) psychLog.innerHTML = psychLog.innerHTML.split('<br>').slice(0,10).join('<br>');
            }
        }
    }
</script>
</body>
</html>
